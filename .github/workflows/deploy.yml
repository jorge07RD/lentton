name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: web
        # npm install (no `npm ci`): el runner usa otra versión de npm que la local
        # y discrepan en deps opcionales por plataforma (@emnapi/*); `npm ci` es
        # estricto con eso y falla. `npm install` tolera ese desfase del lockfile.
        run: npm install

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy .svelte-kit/cloudflare --project-name=lentton --branch=main
