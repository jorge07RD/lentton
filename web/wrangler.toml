name = "lentton"
pages_build_output_dir = "build"
compatibility_date = "2024-11-01"

# Base de datos SQLite (Cloudflare D1). Para producción:
#   wrangler d1 create lentton   -> pegá el database_id que devuelve.
[[d1_databases]]
binding = "DB"
database_name = "lentton"
database_id = "local-placeholder"

# Almacenamiento de archivos (contenido de los libros y portadas).
#   wrangler r2 bucket create lentton-books
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "lentton-books"
