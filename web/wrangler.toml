name = "lentton"
# adapter-cloudflare construye un _worker.js en .svelte-kit/cloudflare.
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2024-11-01"

# Base de datos SQLite (Cloudflare D1). Para producción:
#   wrangler d1 create lentton   -> pegá el database_id que devuelve.
[[d1_databases]]
binding = "DB"
database_name = "lentton"
database_id = "0c8a7e3c-6d71-4edc-933a-62de812858d1"
